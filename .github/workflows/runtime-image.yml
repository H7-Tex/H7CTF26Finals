name: Runtime image checks

on:
  pull_request:
    paths:
      - "infra/images/runtime/**"
      - "infra/deployment/**"
      - "infra/platform/**"
      - "infra/reconciler/**"
      - "infra/secrets/**"
      - "infra/volumes/**"
      - "infra/terraform/environments/production/oci-runtime-builders/**"
      - "infra/terraform/environments/production/oci-runtime-images/**"
      - ".github/workflows/runtime-image.yml"
  push:
    branches:
      - main
    paths:
      - "infra/images/runtime/**"
      - "infra/deployment/**"
      - "infra/platform/**"
      - "infra/reconciler/**"
      - "infra/secrets/**"
      - "infra/volumes/**"
      - "infra/terraform/environments/production/oci-runtime-builders/**"
      - "infra/terraform/environments/production/oci-runtime-images/**"
      - ".github/workflows/runtime-image.yml"

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: infra/deployment/go.mod
          cache-dependency-path: infra/deployment/go.mod
      - run: infra/deployment/tests/run.sh
      - run: infra/images/runtime/tests/static.sh
      - run: infra/secrets/tests/run.sh
      - run: infra/volumes/tests/run.sh
      - run: infra/platform/tests/run.sh
      - run: python3 -m unittest discover -s infra/terraform/tests -p 'test_*.py'
