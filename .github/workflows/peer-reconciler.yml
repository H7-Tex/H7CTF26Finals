name: Peer reconciler checks

on:
  pull_request:
    paths:
      - "infra/reconciler/**"
      - "infra/images/router/**"
      - ".github/workflows/peer-reconciler.yml"
  push:
    branches:
      - main
    paths:
      - "infra/reconciler/**"
      - "infra/images/router/**"
      - ".github/workflows/peer-reconciler.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test reconciliation state machine
        run: infra/reconciler/tests/run.sh
