name: Takeout
author: abu
category: misc
difficulty: medium
description: |
  A password manager folded and let everyone export their vault to a single file before the servers went dark. This is one of those files, pulled off a dead laptop. The vendor's FAQ promised the backups were unreadable without the app, and the app is gone too.

  The owner only ever cared about one entry in there. Read it anyway.
sub_description: |
  One backup file from a defunct vault app, in nobody's documented format. Recover the entry it kept.
points: 300
