worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  access_log /dev/stdout combined;
  server_tokens off;
  server {
    listen 8080;
    root /srv/pypi;
    location = /healthz { return 200 "ok\n"; }
    location /simple/ { autoindex off; try_files $uri $uri/ =404; }
    location /packages/ { autoindex off; try_files $uri =404; }
    location / { return 404; }
  }
}
