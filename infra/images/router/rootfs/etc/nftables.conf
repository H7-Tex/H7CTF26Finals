flush ruleset

table inet event_router {
  set peer_addresses {
    type ipv4_addr
  }

  map peer_snat {
    type ipv4_addr : ipv4_addr
  }

  set workbench_sources {
    type ipv4_addr
    flags interval
    elements = {
      10.61.1.0/24,
      10.61.2.0/24,
      10.61.3.0/24,
      10.61.4.0/24,
      10.61.5.0/24,
      10.61.6.0/24,
      10.61.7.0/24,
      10.61.8.0/24,
      10.61.9.0/24,
      10.61.10.0/24,
      10.61.11.0/24,
      10.61.12.0/24,
      10.61.13.0/24,
      10.61.14.0/24,
      10.61.15.0/24
    }
  }

  map workbench_snat {
    type ipv4_addr : ipv4_addr
    flags interval
    elements = {
      10.61.1.0/24 : 10.60.250.121,
      10.61.2.0/24 : 10.60.250.122,
      10.61.3.0/24 : 10.60.250.123,
      10.61.4.0/24 : 10.60.250.124,
      10.61.5.0/24 : 10.60.250.125,
      10.61.6.0/24 : 10.60.250.126,
      10.61.7.0/24 : 10.60.250.127,
      10.61.8.0/24 : 10.60.250.128,
      10.61.9.0/24 : 10.60.250.129,
      10.61.10.0/24 : 10.60.250.130,
      10.61.11.0/24 : 10.60.250.131,
      10.61.12.0/24 : 10.60.250.132,
      10.61.13.0/24 : 10.60.250.133,
      10.61.14.0/24 : 10.60.250.134,
      10.61.15.0/24 : 10.60.250.135
    }
  }

  set routed_networks {
    type ipv4_addr
    flags interval
    elements = { 10.60.0.0/16, 10.61.0.0/16 }
  }

  chain prerouting {
    type nat hook prerouting priority dstnat; policy accept;
    ip daddr 10.60.250.101 tcp dport 443 dnat ip to 10.60.200.10:443
  }

  chain input {
    type filter hook input priority filter; policy drop;
    ip daddr 10.60.250.100 tcp dport 443 counter drop
    ip daddr 10.60.250.101 udp dport 443 counter drop
    ct state invalid drop
    ct state established,related accept
    iifname "lo" accept
    udp sport 67 udp dport 68 accept
    ip daddr 10.60.250.100 udp dport 443 counter accept
    ip saddr 10.60.201.0/24 tcp dport 22 accept
    ip saddr 10.60.201.0/24 icmp type echo-request accept
    icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
    limit rate 20/second burst 40 packets log prefix "router_input_drop " level info counter drop
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
    ct state invalid drop
    ct state established,related accept
    ct status dnat ip daddr 10.60.200.10 tcp dport 443 ct state new limit rate 200/second burst 400 packets log prefix "router_web_allow " level info counter accept
    iifname "wg0" ip saddr @peer_addresses ip daddr @routed_networks ct state new limit rate 500/second burst 1000 packets log prefix "router_peer_allow " level info counter accept
    ip saddr @workbench_sources ip daddr @routed_networks ct state new limit rate 500/second burst 1000 packets log prefix "router_team_allow " level info counter accept
    iifname "wg0" limit rate 100/second burst 200 packets log prefix "router_peer_drop " level info counter drop
    ip saddr @workbench_sources limit rate 100/second burst 200 packets log prefix "router_team_drop " level info counter drop
  }

  chain output {
    type filter hook output priority filter; policy drop;
    ct state invalid drop
    ct state established,related accept
    oifname "lo" accept
    ip daddr @routed_networks accept
    ip daddr 169.254.169.254 udp dport { 53, 123 } accept
    ip daddr 169.254.169.254 tcp dport 53 accept
    ip daddr { 169.254.0.2, 169.254.2.0/24 } tcp dport 3260 accept
    udp sport 68 udp dport 67 accept
  }

  chain postrouting {
    type nat hook postrouting priority srcnat; policy accept;
    ct status dnat ip daddr 10.60.200.10 tcp dport 443 masquerade
    ip saddr @peer_addresses snat to ip saddr map @peer_snat
    ip saddr @workbench_sources snat to ip saddr map @workbench_snat
  }
}
