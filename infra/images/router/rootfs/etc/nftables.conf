flush ruleset

table inet event_router {
  set peer_addresses {
    type ipv4_addr
  }

  map peer_snat {
    type ipv4_addr : ipv4_addr
  }

  set peer_workbench_access {
    type ipv4_addr . ipv4_addr
  }

  set peer_production_access {
    type ipv4_addr . ipv4_addr
  }

  set production_addresses {
    type ipv4_addr
    elements = {
      10.60.1.2,
      10.60.2.2,
      10.60.3.2,
      10.60.4.2,
      10.60.5.2,
      10.60.6.2,
      10.60.7.2,
      10.60.8.2,
      10.60.9.2,
      10.60.10.2,
      10.60.11.2,
      10.60.12.2,
      10.60.13.2,
      10.60.14.2,
      10.60.15.2,
      10.60.16.2
    }
  }

  set staging_addresses {
    type ipv4_addr
    elements = {
      10.60.1.3,
      10.60.2.3,
      10.60.3.3,
      10.60.4.3,
      10.60.5.3,
      10.60.6.3,
      10.60.7.3,
      10.60.8.3,
      10.60.9.3,
      10.60.10.3,
      10.60.11.3,
      10.60.12.3,
      10.60.13.3,
      10.60.14.3,
      10.60.15.3,
      10.60.16.3
    }
  }

  set workbench_addresses {
    type ipv4_addr
    elements = {
      10.61.1.2,
      10.61.2.2,
      10.61.3.2,
      10.61.4.2,
      10.61.5.2,
      10.61.6.2,
      10.61.7.2,
      10.61.8.2,
      10.61.9.2,
      10.61.10.2,
      10.61.11.2,
      10.61.12.2,
      10.61.13.2,
      10.61.14.2,
      10.61.15.2
    }
  }

  set workbench_production_access {
    type ipv4_addr . ipv4_addr
    elements = {
      10.61.1.2 . 10.60.1.2,
      10.61.2.2 . 10.60.2.2,
      10.61.3.2 . 10.60.3.2,
      10.61.4.2 . 10.60.4.2,
      10.61.5.2 . 10.60.5.2,
      10.61.6.2 . 10.60.6.2,
      10.61.7.2 . 10.60.7.2,
      10.61.8.2 . 10.60.8.2,
      10.61.9.2 . 10.60.9.2,
      10.61.10.2 . 10.60.10.2,
      10.61.11.2 . 10.60.11.2,
      10.61.12.2 . 10.60.12.2,
      10.61.13.2 . 10.60.13.2,
      10.61.14.2 . 10.60.14.2,
      10.61.15.2 . 10.60.15.2
    }
  }

  set service_ports {
    type inet_service
    flags interval
    elements = { 7001-7006 }
  }

  set platform_ports {
    type inet_service
    elements = { 443, 4141 }
  }

  set hill_services {
    type ipv4_addr . inet_service
    elements = {
      10.60.210.11 . 7101,
      10.60.210.12 . 7102,
      10.60.210.13 . 7103
    }
  }

  set released_production_addresses {
    type ipv4_addr
  }

  set released_hill_services {
    type ipv4_addr . inet_service
  }

  set mirror_ports {
    type inet_service
    elements = { 3141, 3142, 4873, 5000 }
  }

  set archive_https_ports {
    type inet_service
  }

  set archive_imds_ports {
    type inet_service
  }

  set managed_addresses {
    type ipv4_addr
    elements = {
      10.60.1.2,
      10.60.1.3,
      10.60.2.2,
      10.60.2.3,
      10.60.3.2,
      10.60.3.3,
      10.60.4.2,
      10.60.4.3,
      10.60.5.2,
      10.60.5.3,
      10.60.6.2,
      10.60.6.3,
      10.60.7.2,
      10.60.7.3,
      10.60.8.2,
      10.60.8.3,
      10.60.9.2,
      10.60.9.3,
      10.60.10.2,
      10.60.10.3,
      10.60.11.2,
      10.60.11.3,
      10.60.12.2,
      10.60.12.3,
      10.60.13.2,
      10.60.13.3,
      10.60.14.2,
      10.60.14.3,
      10.60.15.2,
      10.60.15.3,
      10.60.16.2,
      10.60.16.3,
      10.60.200.10,
      10.60.201.20,
      10.60.201.30,
      10.60.202.10,
      10.60.210.11,
      10.60.210.12,
      10.60.210.13,
      10.61.1.2,
      10.61.2.2,
      10.61.3.2,
      10.61.4.2,
      10.61.5.2,
      10.61.6.2,
      10.61.7.2,
      10.61.8.2,
      10.61.9.2,
      10.61.10.2,
      10.61.11.2,
      10.61.12.2,
      10.61.13.2,
      10.61.14.2,
      10.61.15.2
    }
  }

  map workbench_snat {
    type ipv4_addr : ipv4_addr
    elements = {
      10.61.1.2 : 10.60.250.121,
      10.61.2.2 : 10.60.250.122,
      10.61.3.2 : 10.60.250.123,
      10.61.4.2 : 10.60.250.124,
      10.61.5.2 : 10.60.250.125,
      10.61.6.2 : 10.60.250.126,
      10.61.7.2 : 10.60.250.127,
      10.61.8.2 : 10.60.250.128,
      10.61.9.2 : 10.60.250.129,
      10.61.10.2 : 10.60.250.130,
      10.61.11.2 : 10.60.250.131,
      10.61.12.2 : 10.60.250.132,
      10.61.13.2 : 10.60.250.133,
      10.61.14.2 : 10.60.250.134,
      10.61.15.2 : 10.60.250.135
    }
  }

  set routed_networks {
    type ipv4_addr
    flags interval
    elements = { 10.60.0.0/16, 10.61.0.0/16 }
  }

  map forwarding_gate {
    type mark : verdict
  }

  chain prerouting {
    type nat hook prerouting priority dstnat; policy accept;
    ip daddr 10.60.250.101 tcp dport 443 dnat ip to 10.60.200.10:443
  }

  chain input {
    type filter hook input priority filter; policy drop;
    ip daddr 10.60.250.100 tcp dport 443 counter drop
    ip daddr 10.60.250.101 udp dport 443 counter drop
    ct state invalid drop
    ct state established,related accept
    iifname "lo" accept
    udp sport 67 udp dport 68 accept
    ip daddr 10.60.250.100 udp dport 443 counter accept
    ip saddr 10.60.201.20 tcp dport 22 accept
    ip saddr 10.60.200.5 tcp dport 22 accept
    ip saddr 10.60.201.0/24 icmp type echo-request accept
    icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
    limit rate 20/second burst 40 packets log prefix "router_input_drop " level info counter drop
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
    meta mark set 0
    meta mark vmap @forwarding_gate
    counter drop
  }

  chain released_production_guard {
    ip daddr @released_production_addresses return
    counter drop
  }

  chain released_hill_guard {
    ip daddr . tcp dport @released_hill_services return
    counter drop
  }

  chain released_production_reply_guard {
    ip saddr @released_production_addresses return
    counter drop
  }

  chain released_hill_reply_guard {
    ip saddr . tcp sport @released_hill_services return
    counter drop
  }

  chain forward_enabled {
    ct state invalid drop
    iifname "wg0" ip saddr @peer_addresses ip daddr @production_addresses tcp dport @service_ports jump released_production_guard
    iifname "wg0" ip saddr @peer_addresses ip daddr . tcp dport @hill_services jump released_hill_guard
    ip saddr @workbench_addresses ip daddr @production_addresses tcp dport @service_ports jump released_production_guard
    ip saddr @workbench_addresses ip daddr . tcp dport @hill_services jump released_hill_guard
    ip saddr @production_addresses tcp sport @service_ports ip daddr @peer_addresses jump released_production_reply_guard
    ip saddr @production_addresses tcp sport @service_ports ip daddr @workbench_addresses jump released_production_reply_guard
    ip saddr . tcp sport @hill_services ip daddr @peer_addresses jump released_hill_reply_guard
    ip saddr . tcp sport @hill_services ip daddr @workbench_addresses jump released_hill_reply_guard
    ct state established,related accept
    ct status dnat ip daddr 10.60.200.10 tcp dport 443 ct state new limit rate 200/second burst 400 packets log prefix "router_web_allow " level info counter accept
    iifname "wg0" ip saddr @peer_addresses ip daddr @released_production_addresses tcp dport @service_ports ct state new limit rate 500/second burst 1000 packets log prefix "router_peer_service " level info counter accept
    iifname "wg0" ip saddr @peer_addresses ip daddr . tcp dport @released_hill_services ct state new limit rate 500/second burst 1000 packets log prefix "router_peer_hill " level info counter accept
    iifname "wg0" ip saddr @peer_addresses ip daddr 10.60.200.10 tcp dport @platform_ports ct state new limit rate 200/second burst 400 packets log prefix "router_peer_platform " level info counter accept
    iifname "wg0" ip saddr @peer_addresses ip daddr 10.60.201.30 tcp dport { 22, 443 } ct state new limit rate 200/second burst 400 packets log prefix "router_peer_repository " level info counter accept
    iifname "wg0" ip saddr . ip daddr @peer_workbench_access ct state new limit rate 500/second burst 1000 packets log prefix "router_peer_workbench " level info counter accept
    iifname "wg0" ip saddr . ip daddr @peer_production_access tcp dport 22 ct state new limit rate 100/second burst 200 packets log prefix "router_peer_production_ssh " level info counter accept
    ip saddr @workbench_addresses ip daddr @released_production_addresses tcp dport @service_ports ct state new limit rate 500/second burst 1000 packets log prefix "router_workbench_service " level info counter accept
    ip saddr @workbench_addresses ip daddr . tcp dport @released_hill_services ct state new limit rate 500/second burst 1000 packets log prefix "router_workbench_hill " level info counter accept
    ip saddr @workbench_addresses ip daddr 10.60.200.10 tcp dport @platform_ports ct state new limit rate 200/second burst 400 packets log prefix "router_workbench_platform " level info counter accept
    ip saddr @workbench_addresses ip daddr 10.60.201.30 tcp dport { 22, 443 } ct state new limit rate 200/second burst 400 packets log prefix "router_workbench_repository " level info counter accept
    ip saddr @workbench_addresses ip daddr 10.60.202.10 tcp dport @mirror_ports ct state new limit rate 500/second burst 1000 packets log prefix "router_workbench_mirror " level info counter accept
    ip saddr . ip daddr @workbench_production_access tcp dport { 9100, 9101 } ct state new limit rate 100/second burst 200 packets log prefix "router_workbench_manage " level info counter accept
    ip saddr 10.60.201.20 ip daddr @production_addresses tcp dport @service_ports ct state new accept
    ip saddr 10.60.201.20 ip daddr @staging_addresses tcp dport @service_ports ct state new accept
    ip saddr 10.60.201.20 ip daddr 10.60.200.10 tcp dport 443 ct state new accept
    ip saddr 10.60.200.10 ip daddr 10.60.201.20 tcp dport 9001-9006 ct state new accept
    ip saddr 10.60.201.20 ip daddr { 10.60.250.10, 10.60.250.11 } tcp dport 22 ct state new accept
    ip saddr { 10.60.200.10, 10.60.201.20, 10.60.201.30 } ip daddr @production_addresses tcp dport 9300 ct state new accept
    ip saddr @production_addresses ip daddr 10.60.200.10 tcp dport 443 ct state new accept
    ip saddr @production_addresses ip daddr 10.60.201.20 tcp dport 9300 ct state new accept
    ip saddr @production_addresses ip daddr 10.60.201.30 tcp dport { 22, 443 } ct state new accept
    ip saddr @production_addresses ip daddr 10.60.202.10 tcp dport @mirror_ports ct state new accept
    ip saddr 10.60.200.5 ip daddr @managed_addresses tcp dport 22 ct state new accept
    ip saddr 10.60.200.5 ip daddr { 10.60.250.10, 10.60.250.11 } tcp dport 22 ct state new accept
    ip saddr 10.60.200.5 ip daddr 10.60.201.30 tcp dport 2222 ct state new accept
    ip saddr 10.60.200.5 ip daddr @managed_addresses icmp type echo-request ct state new accept
    iifname "wg0" limit rate 100/second burst 200 packets log prefix "router_peer_drop " level info counter drop
    ip saddr @workbench_addresses limit rate 100/second burst 200 packets log prefix "router_team_drop " level info counter drop
    limit rate 100/second burst 200 packets log prefix "router_forward_drop " level info counter drop
  }

  chain output {
    type filter hook output priority filter; policy drop;
    ct state invalid drop
    ct state established,related accept
    oifname "lo" accept
    ip daddr @routed_networks accept
    ip daddr 169.254.169.254 udp dport { 53, 123 } accept
    ip daddr 169.254.169.254 tcp dport 53 accept
    ip daddr 169.254.169.254 tcp dport 80 accept
    ip daddr { 169.254.0.2, 169.254.2.0/24 } tcp dport 3260 accept
    udp sport 68 udp dport 67 accept
    ip daddr 169.254.169.254 tcp dport @archive_imds_ports accept
    tcp dport @archive_https_ports accept
  }

  chain postrouting {
    type nat hook postrouting priority srcnat; policy accept;
    ct status dnat ip daddr 10.60.200.10 tcp dport 443 masquerade
    ip daddr @production_addresses tcp dport @service_ports snat to 10.60.250.120
    ip daddr @staging_addresses tcp dport @service_ports snat to 10.60.250.120
    ip saddr @peer_addresses snat to ip saddr map @peer_snat
    ip saddr @workbench_addresses snat to ip saddr map @workbench_snat
    tcp dport @archive_https_ports snat ip to 10.60.250.101
  }
}
