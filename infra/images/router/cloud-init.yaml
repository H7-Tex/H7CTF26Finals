#cloud-config
ssh_deletekeys: true
ssh_genkeytypes:
  - ed25519
write_files:
  - path: /etc/event-router/role
    owner: root:root
    permissions: '0644'
    content: |
      __ROUTER_STATE__
  - path: /etc/ssh/sshd_config.d/91-operations-relay.conf
    owner: root:root
    permissions: '0644'
    content: |
      AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/operations_relay_authorized_keys_%u
  - path: /etc/ssh/operations_relay_authorized_keys_ubuntu
    owner: root:root
    permissions: '0644'
    content: |
      __OPERATIONS_RELAY_AUTHORIZED_KEY__
runcmd:
  - ["install", "-d", "-m", "0755", "/run/sshd"]
  - ["/usr/sbin/sshd", "-t"]
  - ["systemctl", "enable", "--now", "ssh.service"]
  - ["systemctl", "restart", "ssh.service"]
  - ["/usr/local/sbin/finals-host-recipient"]
  - ["/usr/local/sbin/event-router-initialize", "__ROUTER_STATE__"]
